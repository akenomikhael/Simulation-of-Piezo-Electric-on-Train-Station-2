name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil file dari GitHub
        uses: actions/checkout@v4

      - name: 2. Siapkan Node.js & Java 17
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Pindahkan file web ke folder www
        run: |
          mkdir -p temp_www
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'temp_www' -exec cp -r {} temp_www/ \;
          mv temp_www www
          ls -la www

      - name: 4. Instal Capacitor 6
        run: |
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          npx cap init "Aplikasi Saya" "com.aplikasi.saya" --web-dir=www
          npx cap add android

      - name: 5. Buat file APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. Upload hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: hasil-aplikasi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
